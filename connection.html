<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connectez-vous</title>
    <link rel="stylesheet" href="connection.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

</body>
<div class="container-xxl">
    <h1>ENI - MEMORY - Connection</h1>

    <div class="btn-group">
        <a href="./index.html" class="btn btn-dark d-flex align-items-center justify-content-center ">Accueil</a>
        <a href="./formulaire.html" class="btn btn-dark d-flex align-items-center justify-content-center">S'inscrire</a>
        <a href="#" class="btn btn-dark d-flex align-items-center justify-content-center active">Se connecter</a>
        <a href="./profil.html" class="btn btn-dark d-flex align-items-center justify-content-center">Profil</a>
        <a href="./memory.html" class="btn btn-dark d-flex align-items-center justify-content-center">Jouer</a>
    </div>

    <div class="container-lg">
        <h2>Connectez-vous</h2>
        <ul>
            <li class="input">
                <label for="email">Entrez votre adresse mail</label>
                <input class="entree" type="text" name="user_email" id="mail" placeholder="Email">
            </li>
            <li class="input">
                <label for="mdp">Entrez un mot de passe</label>
                <input class="entree" type="text" name="user_password" id="password" placeholder="Votre mot de passe">
            </li>
        </ul>

        <div class="boutons">
            <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
                <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off">
                <label class="btn btn-outline-light" for="btnradio1">Connectez-vous</label>

                <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off" checked>
                <label class="btn btn-outline-light" for="btnradio2">Annuler</label>
            </div>
        </div>

    </div>
</div>

</html>
