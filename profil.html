<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
    <link rel="stylesheet" href="profil.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container-xxl">
        <h1>ENI - MEMORY - Profil</h1>

        <div class="btn-group">
            <a href="./index.html" class="btn btn-dark d-flex align-items-center justify-content-center ">Accueil</a>
            <a href="./formulaire.html" class="btn btn-dark d-flex align-items-center justify-content-center">S'inscrire</a>
            <a href="./connection.html" class="btn btn-dark d-flex align-items-center justify-content-center">Se connecter</a>
            <a href="#" class="btn btn-dark d-flex align-items-center justify-content-center active">Profil</a>
            <a href="./memory.html" class="btn btn-dark d-flex align-items-center justify-content-center">Jouer</a>
        </div>

        <div class="container-lg">
            <h2>Profil</h2>

                <img src="./images/3593455.png" alt="Point d'intérogation" class="interogation">

            <ul>
                <li class="input">
                    <label for="email">Entrez votre adresse mail</label>
                    <input class="entree" type="text" name="user_email" id="mail" placeholder="Email">
                </li>
                <li class="input">
                    <label for="mdp">Entrez votre mot de passe</label>
                    <input class="entree" type="text" name="user_password" id="password"
                        placeholder="Votre mot de passe">
                </li>
            </ul>

            <div class="selection">
                <label for="pet-select">Choix du memory : </label>

                <select name="pets" id="pet-select">
                    <option value="">--Choisissez une option--</option>
                    <option value="Chien">Chien</option>
                    <option value="Animaux">Animaux</option>
                    <option value="Monstres">Monstres</option>
                    <option value="Ronds colorés">Ronds colorés</option>
                </select>
            </div>

        </div>
    </div>
</body>

</html>
